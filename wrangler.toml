name = "subconverter-web"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# 静态资源（前端页面），由 Worker 自动 fallthrough
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV 命名空间：保存允许调用的密钥列表
# fork 本仓库后请运行：npx wrangler kv namespace create AUTH_KV
# 然后用命令输出的 id 替换下面的占位符 REPLACE_WITH_YOUR_KV_ID
[[kv_namespaces]]
binding = "AUTH_KV"
id = "e56bd26ac5cc4e09a54d78982b68d96e"

# 可选：通过环境变量直接配置一组密钥（逗号分隔），优先级低于 KV
# wrangler secret put STATIC_KEYS
[vars]
# 这里可以放非敏感配置，例如默认 User-Agent
DEFAULT_UA = "ClashforWindows/0.20.39"
