name = "subconverter-web"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# 静态资源（前端页面），由 Worker 自动 fallthrough
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV 命名空间：保存允许调用的密钥列表
# 部署前请运行：wrangler kv namespace create AUTH_KV
# 然后把生成的 id 粘贴到下面
[[kv_namespaces]]
binding = "AUTH_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# 可选：通过环境变量直接配置一组密钥（逗号分隔），优先级低于 KV
# wrangler secret put STATIC_KEYS
[vars]
# 这里可以放非敏感配置，例如默认 User-Agent
DEFAULT_UA = "ClashforWindows/0.20.39"
